name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  rust:
    name: Rust
    runs-on: [self-hosted, fedora, earthly, docker]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: anubis
          POSTGRES_PASSWORD: anubis
          POSTGRES_DB: anubis_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U anubis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://anubis:anubis@localhost:55432/anubis_test
    steps:
      - uses: actions/checkout@v4

      # The toolchain version matches rust-toolchain.toml. Self-hosted runners
      # keep the cargo registry and target dir warm, so no cache step is needed.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The generated TypeScript permissions module must match roles.yml.
      - name: Roles drift check
        run: |
          cargo run --quiet --bin anubis -- roles generate-ts \
            --file starter/config/roles.yml \
            --out starter/frontend/src/roles.generated.ts
          git diff --exit-code starter/frontend/src/roles.generated.ts

  frontend:
    name: Frontend
    runs-on: [self-hosted, fedora, earthly, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
