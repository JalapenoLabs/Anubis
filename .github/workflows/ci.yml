name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  rust:
    name: Rust
    runs-on: [self-hosted, rocky9, earthly, docker]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: anubis
          POSTGRES_PASSWORD: anubis
          POSTGRES_DB: anubis_test
        ports:
          # Ephemeral host port: concurrent runs (and stale containers) on a
          # shared self-hosted runner can never collide on a fixed port.
          - 5432
        options: >-
          --health-cmd "pg_isready -U anubis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Realtime channels run in process without this; the service exists so
      # the Redis fanout is covered rather than skipped. See docs/realtime.md.
      redis:
        image: redis:7.4.10-alpine
        ports:
          # Ephemeral host port, for the same reason Postgres uses one.
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The toolchain version matches rust-toolchain.toml. Self-hosted runners
      # keep the cargo registry and target dir warm, so no cache step is needed.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          DATABASE_URL: postgres://anubis:anubis@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/anubis_test
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
        run: cargo test --workspace

      # The generated TypeScript permissions module must match roles.yml.
      - name: Roles drift check
        run: |
          cargo run --quiet --bin anubis -- roles generate-ts \
            --file starter/config/roles.yml \
            --out starter/frontend/src/roles.generated.ts
          git diff --exit-code starter/frontend/src/roles.generated.ts

      # The generated TypeScript client must match the OpenAPI document.
      - name: Client drift check
        run: |
          cargo run --quiet --bin anubis -- client generate-ts \
            --out frontend/src/api/v1.generated.ts
          git diff --exit-code frontend/src/api/v1.generated.ts

      # The starter's client is rendered from the document the starter itself
      # merges, so the application exports it and the CLI renders that export.
      - name: Application client drift check
        run: |
          exported="$(mktemp)"
          cargo run --quiet -p anubis-starter -- openapi > "$exported"
          cargo run --quiet --bin anubis -- client generate-ts \
            --from "$exported" \
            --out starter/frontend/src/api/v1.generated.ts
          git diff --exit-code starter/frontend/src/api/v1.generated.ts

      # The runner keeps ~/.cargo/bin between runs, so only the first run on a
      # fresh runner pays the few minutes cargo-audit takes to compile. Failing
      # to install it must not fail the job while the audit itself is advisory.
      - name: Install cargo-audit
        continue-on-error: true
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked

      # RustSec advisories against Cargo.lock. Non-blocking on purpose: a new
      # advisory published overnight must not stop unrelated work from merging,
      # and the point today is that every push reports the current exposure.
      # Flip continue-on-error to false once the report is routinely empty and
      # a fresh advisory is something the team wants to fix before merging.
      - name: Audit Rust dependencies
        continue-on-error: true
        run: cargo audit

  frontend:
    name: Frontend
    runs-on: [self-hosted, rocky9, earthly, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # npm advisories across every workspace and the whole dependency tree.
      # Non-blocking for the same reason the Rust audit is; flip
      # continue-on-error to false alongside it.
      - name: Audit npm dependencies
        continue-on-error: true
        run: yarn npm audit --all --recursive
