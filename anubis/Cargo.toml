[package]
name = "anubis"
description = "A Rust-first SaaS framework: teams, roles, auth, a versioned REST API, and full-stack scaffolding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["saas", "framework", "web", "scaffolding"]
categories = ["web-programming", "development-tools"]

[lib]
name = "anubis"
path = "src/lib.rs"

[[bin]]
name = "anubis"
path = "src/main.rs"

[dependencies]
aes-gcm = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
data-encoding = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel_migrations = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
image = { workspace = true }
lettre = { workspace = true }
openidconnect = { workspace = true }
qrcode = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-scalar = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { workspace = true }

[dev-dependencies]
# Integration tests are their own crates, so the websocket test needs its own
# entries for what the library already depends on.
futures-util = { workspace = true }
http-body-util = { workspace = true }
# `start_paused` lets a test prove the request timeout without spending it.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
