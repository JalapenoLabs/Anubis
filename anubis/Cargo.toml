[package]
name = "anubis"
description = "A Rust-first SaaS framework: teams, roles, auth, a versioned REST API, and full-stack scaffolding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["saas", "framework", "web", "scaffolding"]
categories = ["web-programming", "development-tools"]
# Publishing is a whitelist, for two reasons. The starter template is a build
# artifact here (`scripts/vendor-starter.sh` copies it in, and `.gitignore`
# hides it), and cargo skips gitignored files unless an `include` list makes it
# walk the filesystem instead of asking git. And `starter/backend` is a package
# of its own, which the walk would otherwise prune as a nested package.
# `tests/` is deliberately absent: those tests drive the monorepo's layout and
# a real Postgres, so shipping them would ship tests that cannot pass.
include = [
  "build.rs",
  "LICENSE",
  "migrations/**",
  "README.md",
  "src/**",
  "starter/**",
  "templates/**",
]

[lib]
name = "anubis"
path = "src/lib.rs"

[[bin]]
name = "anubis"
path = "src/main.rs"

[dependencies]
aes-gcm = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
data-encoding = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel_migrations = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
image = { workspace = true }
lettre = { workspace = true }
openidconnect = { workspace = true }
qrcode = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-scalar = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Integration tests are their own crates, so the websocket test needs its own
# entries for what the library already depends on.
futures-util = { workspace = true }
http-body-util = { workspace = true }
# `start_paused` lets a test prove the request timeout without spending it.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
# The passkey ceremony suite's software authenticator, and the wire types it
# implements a backend over. Test-only: nothing in the library signs a
# ceremony, it only verifies one.
webauthn-authenticator-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }

[lints]
workspace = true
