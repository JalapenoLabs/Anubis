[package]
name = "anubis-starter"
description = "The anubis-starter application server."
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
# Anubis is installed from its repository until the crate is published.
anubis = { git = "https://github.com/JalapenoLabs/Anubis.git" }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
# The libpq-linked "postgres" feature stays off; connections go through
# diesel-async's pure-Rust tokio-postgres backend so builds need no native libs.
diesel = { version = "2.3", features = ["postgres_backend", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2.3"
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
