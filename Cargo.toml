[workspace]
resolver = "3"
members = [
  "anubis",
  "starter/backend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jalapeno Labs"]
repository = "https://github.com/JalapenoLabs/Anubis"

[workspace.dependencies]
# Pure-Rust AES-256-GCM for secrets that must be read back, such as TOTP seeds.
# Default features add a second RNG stack; nonces come from `getrandom` instead.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anubis = { path = "anubis", version = "0.1.0" }
argon2 = { version = "0.5", features = ["std"] }
# The `ws` feature carries the realtime channel endpoint; see `anubis::realtime`.
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2"
# The libpq-linked "postgres" feature stays off; connections go through
# diesel-async's pure-Rust tokio-postgres backend so builds need no native libs.
diesel = { version = "2.3", features = ["postgres_backend", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2.3"
# Stream and sink combinators the websocket and Redis pub/sub loops need.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.4"
# HMAC for TOTP codes and outgoing webhook signatures. Pinned to the line that
# rides `digest` 0.11, the same generation as `sha1` and `sha2` below, so one
# Mac type covers both hashes.
hmac = "0.13"
http-body-util = "0.1"
# Decoders limited to formats browsers actually upload.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# SMTP delivery for the production mailer. The default feature set links
# native-tls, so it stays off and the pinned set spells out the policy: the
# tokio executor, rustls for both smtps:// and STARTTLS, pooled connections,
# and the message builder. No OpenSSL enters the tree.
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "pool",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls-tls",
] }
mimalloc = "0.1"
# OpenID Connect sign-in. The default feature pair is exactly the policy we
# want, spelled out here so a future default change cannot pull in native TLS:
# reqwest as the async HTTP backend, rustls as its TLS stack, no OpenSSL.
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "rustls-tls"] }
qrcode = "0.14"
# Redis pub/sub for the optional multi-instance realtime fanout. Defaults add
# command families the framework never issues, so the set is spelled out: async
# tokio connections, a reconnecting publisher, and rustls for `rediss://` with
# the webpki root store. No OpenSSL enters the tree.
redis = { version = "1.5", default-features = false, features = [
  "connection-manager",
  "tls-rustls-webpki-roots",
  "tokio-comp",
  "tokio-rustls-comp",
] }
# The outgoing webhook delivery client. Defaults link native TLS, so the set is
# spelled out and matches what `openidconnect` already builds on: rustls, no
# OpenSSL, and no second copy of the client in the tree.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha1 = "0.11"
sha2 = "0.11"
time = "0.3"
tokio = { version = "1", features = ["full"] }
# The websocket client the realtime integration test drives. Plain `ws://` to a
# test server on loopback, so no TLS feature is enabled. Pinned to the line
# axum's `ws` feature already builds on, so tests add no second copy of it.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }
# The serve path's middleware: filesystem services for the built SPA, response
# compression, request tracing, and the opt-in CORS layer. Request ids,
# timeouts, and the security headers are framework code, so no feature covers
# them. Compression is gzip and brotli only: between them every browser in use
# is covered, and deflate and zstd would each add an encoder to the binary for
# clients that already accept one of these two.
tower-http = { version = "0.6", features = [
  "compression-br",
  "compression-gzip",
  "cors",
  "fs",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Pinned exactly: the 0.6 prerelease is the pure-Rust-crypto line (0.5 links
# native OpenSSL, which the build policy forbids). State serialisation is
# safe here because ceremony states live server-side behind hashed tokens.
webauthn-rs = { version = "=0.6.1-dev", features = [
  "danger-allow-state-serialisation",
  # Username-less (discoverable) login, the password-manager passkey flow.
  "conditional-ui",
] }
# Clears key material from memory on drop. Already in the tree under aes-gcm;
# named here because `anubis::auth::secret_box` uses it directly.
zeroize = "1"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction-group lints that drive up consistency, quality, and brevity.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

# The async web stack unavoidably pulls duplicate transitive crate versions;
# failing the build on that would block every dependency bump.
multiple_crate_versions = "allow"
