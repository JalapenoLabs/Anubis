[workspace]
resolver = "3"
members = [
  "anubis",
  "starter/backend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jalapeno Labs"]
repository = "https://github.com/JalapenoLabs/Anubis"

[workspace.dependencies]
anubis = { path = "anubis", version = "0.1.0" }
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2"
# The libpq-linked "postgres" feature stays off; connections go through
# diesel-async's pure-Rust tokio-postgres backend so builds need no native libs.
diesel = { version = "2.3", features = ["postgres_backend", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2.3"
getrandom = "0.4"
hmac = "0.12"
http-body-util = "0.1"
# Decoders limited to formats browsers actually upload.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mimalloc = "0.1"
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha1 = "0.10"
sha2 = "0.11"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Pinned exactly: the 0.6 prerelease is the pure-Rust-crypto line (0.5 links
# native OpenSSL, which the build policy forbids). State serialisation is
# safe here because ceremony states live server-side behind hashed tokens.
webauthn-rs = { version = "=0.6.1-dev", features = [
  "danger-allow-state-serialisation",
  # Username-less (discoverable) login, the password-manager passkey flow.
  "conditional-ui",
] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction-group lints that drive up consistency, quality, and brevity.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

# The async web stack unavoidably pulls duplicate transitive crate versions;
# failing the build on that would block every dependency bump.
multiple_crate_versions = "allow"
