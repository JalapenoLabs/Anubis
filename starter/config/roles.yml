# Role and permission definitions for the application.
#
# Roles grant per-model actions (read, create, update, destroy) or `manage`
# as shorthand for all four. Roles include other roles transitively. The
# backend embeds this file at compile time and validates it at boot; the
# frontend consumes the module generated by `anubis roles generate-ts`.
#
# `anubis scaffold model` adds each new model above the anchors below: read for
# `default`, manage for `editor`. `billing` and `admin` inherit those grants
# and so need no entries of their own. Each anchor names its role, because the
# grants differ per role and an insertion point can only be found once; a role
# you add by hand should carry its own anchor.
#
# `anubis scaffold join` adds nothing here. A join model is infrastructure, not
# a resource: reading an association is a read on the model that owns it,
# changing it is an update on that model, and listing a form's options is a
# read on the model being offered. One grant per real-world model is what keeps
# this file legible.
#
# `scopes` names the tiers a role may be granted at, out of `platform`,
# `organization`, `sub_tenant`, and `team`. Omit it and the role may be granted
# at every tenancy tier, which is what a role written without it means. Scopes
# say where a role key attaches, never what it grants, so they do not travel
# through `includes`.
#
# `platform` is the exception: a role reaches it only by naming it, because the
# platform is the deployment itself and no role should acquire that reach by
# saying nothing.

roles:
  # Every team member holds `default`.
  default:
    models:
      CreativeConcept: [read]
      TangibleThing: [read]
      GranularDetail: [read]
      PeripheralNotion: [read]
      # 🐺 anubis:models:default

  # Can work with the team's domain resources.
  editor:
    includes: [default]
    models:
      CreativeConcept: [manage]
      TangibleThing: [manage]
      GranularDetail: [manage]
      PeripheralNotion: [manage]
      # 🐺 anubis:models:editor

  # Can manage billing and subscriptions. Subscriptions attach to the
  # organization, so the role means nothing anywhere else.
  billing:
    includes: [default]
    scopes: [organization]
    models: {}

  # Full control, including member management.
  admin:
    includes: [editor, billing]
    models: {}

  # Operates the deployment itself, above every organization in it. Held on the
  # account rather than through a membership, because the platform has no
  # roster; ANUBIS_INITIAL_ADMIN_EMAIL is what appoints the first one. The
  # starter grants it nothing, because the starter has no operator screens: an
  # application adds the models its own operators work with.
  operator:
    scopes: [platform]
    models: {}
