# Subscription plans for the application.
#
# One file defines what this application sells: the plans, the Stripe price
# behind each billing interval, and the limits each plan grants. The backend
# embeds it at compile time and validates it at boot, the same way it treats
# config/roles.yml, so a bad edit fails the build rather than a customer's
# checkout.
#
# Rules the validator enforces:
#
#   - Exactly one plan sells no prices. That is the free plan, and it is what an
#     organization with no subscription is on.
#   - Plan keys and limit names are lowercase letters, digits, and underscores:
#     they are stored on subscriptions and read by the frontend.
#   - A Stripe price belongs to one plan, because a price is what identifies the
#     plan a subscription bought.
#   - A limit a plan does not name is unlimited. There is no magic number for it.
#
# A limit written as a bare number is hard: creating past it is refused with a
# message naming the plan. Writing it as `count` plus `enforcement: soft` lets
# the record through and leaves the screen to say the organization is over.
#
# `seats` is the one limit the framework enforces itself, when an invitation is
# created; every other limit names something only this application can count, so
# the application checks it at its own creation choke points with
# `anubis::billing::Limits::check`. See docs/billing.md.
#
# A price marked `per_seat` is bought with the organization's current seat count
# and kept current as people join and leave, on Stripe's default proration.
#
# `amount` and `currency` are what the pricing page shows, in the currency's
# smallest unit (2900 is $29.00). Stripe's price is the source of truth for what
# a customer is actually charged; only `stripe_price_id` is ever sent to Stripe.
#
# Get the price ids from the Stripe dashboard after creating the products
# (https://dashboard.stripe.com/test/products), and set STRIPE_SECRET_KEY in
# .env to turn billing on. Until it is set, every organization is on the free
# plan and checkout answers 503. See docs/billing.md.
#
# The limit vocabulary below is this application's own: name whatever the
# product meters.

plans:
  - key: free
    name: Free
    description: Everything a small group needs to try the product.
    limits:
      seats: 3
      creative_concepts: 3

  - key: pro
    name: Pro
    description: For a team working together.
    highlighted: true
    prices:
      monthly:
        stripe_price_id: price_replace_me_pro_monthly
        amount: 2900
        currency: usd
        per_seat: true
      yearly:
        stripe_price_id: price_replace_me_pro_yearly
        amount: 29000
        currency: usd
        per_seat: true
    limits:
      seats: 25
      creative_concepts:
        count: 100
        enforcement: soft
