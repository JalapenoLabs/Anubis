services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_development
    ports:
      # Off the default port so a host Postgres never collides.
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
