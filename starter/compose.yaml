services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_development
    ports:
      # Off the default port so a host Postgres never collides.
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Realtime fanout across several instances. Off unless asked for:
  # `docker compose -f starter/compose.yaml --profile realtime up -d --wait`,
  # then run the server with REDIS_URL=redis://localhost:63790. Development
  # needs none of it, since realtime channels are served in process by
  # default. See docs/realtime.md.
  redis:
    image: redis:7.4.10-alpine
    profiles: ["realtime"]
    ports:
      # Off the default port so a host Redis never collides.
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
